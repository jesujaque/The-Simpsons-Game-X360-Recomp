name: Feature request
description: Propón una mejora de port, herramienta o documentación
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
      description: ¿Qué falta o qué resulta incómodo?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Render
        - Audio
        - Input
        - Gameplay / parches
        - Launcher / UI
        - Herramientas
        - Documentación
        - CI / build
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: legal
    attributes:
      label: Confirmación
      options:
        - label: La propuesta no requiere distribuir assets del juego.
          required: true
