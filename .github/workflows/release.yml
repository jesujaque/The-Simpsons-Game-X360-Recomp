name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente creado desde main (ej. v0.1.0)"
        required: true
      draft:
        description: "Crear la release como borrador"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate version and branch
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválido: $TAG (se espera vX.Y.Z)"
            exit 1
          fi

          VERSION="${TAG#v}"
          CMAKE_VERSION="$(sed -n 's/^    VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)"
          if [[ "$CMAKE_VERSION" != "$VERSION" ]]; then
            echo "El tag ($VERSION) no coincide con project(VERSION $CMAKE_VERSION) en CMakeLists.txt"
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "El tag debe apuntar a un commit de main. Haz merge de develop primero."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "OK: $TAG desde main"

  doctor:
    name: Package (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            ext: tar.gz
          - os: windows-latest
            platform: windows-x64
            ext: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSIMPSONS_FULL_BUILD=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXE="build/bin/SimpsonsDoctor.exe"
          else
            EXE="build/bin/SimpsonsDoctor"
          fi
          python tools/package_release.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --doctor "$EXE" \
            --platform "${{ matrix.platform }}" \
            --format "${{ matrix.ext }}" \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, doctor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT_INPUT: ${{ github.event.inputs.draft }}
        run: |
          set -euo pipefail
          DRAFT_FLAG=""
          if [[ "$DRAFT_INPUT" == "true" ]]; then
            DRAFT_FLAG="--draft"
          fi

          gh release create "$TAG" dist/* \
            --title "The Simpsons Game Recompiled $TAG" \
            --generate-notes \
            $DRAFT_FLAG

      - name: Summary
        run: |
          echo "### Release ${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Los artefactos publicados contienen herramientas y documentación." >> "$GITHUB_STEP_SUMMARY"
          echo "El ejecutable del juego se adjunta manualmente ("tools/package_release.py --exe ...")." >> "$GITHUB_STEP_SUMMARY"
